<section class="modulex-h4 modulex-h4--{{h4stil}}" data-mx-hero="1" aria-labelledby="h4-{{id}}-baslik">
  <div class="modulex-h4-wrap">
    <div class="modulex-h4-icerik">
      <p class="modulex-h4-eyebrow modulex-h4-in">{{eyebrow}}</p>
      <h1 class="modulex-h4-baslik modulex-h4-in" id="h4-{{id}}-baslik">{{title}}</h1>
      <p class="modulex-h4-metin modulex-h4-in">{{metin}}</p>
      <div class="modulex-h4-ctalar modulex-h4-in">{{h4ctalar}}</div>
      {{h4guven}}
    </div>
    <div class="modulex-h4-gorsel modulex-h4-in">
      <div class="modulex-h4-sekil" aria-hidden="true"></div>
      <div class="modulex-h4-sekil2" aria-hidden="true"></div>
      <div class="modulex-h4-cerceve">{{h4medya}}</div>
      {{h4rozet}}
    </div>
  </div>
</section>

<style>
  /* Hero 4 — Bölünmüş (31 Eki 2026, G8-A). Renkler yalnız desing anahtarından; varsayılanları var(--mx-site-*, fallback):
     token'sız sitede fallback, colorScheme:auto sitede palet (koyu mod dahil). Üç varyant: blob · kare-kesit · cerceveli. */
  .modulex-h4 {
    box-sizing: border-box;
    width: 100%;
    position: relative;
    overflow: hidden;
    background: --bg--;
    color: --text--;
    padding-block: clamp(48px, 8vw, 104px);
    padding-inline: clamp(16px, 4vw, 32px);
  }
  .modulex-h4 *,
  .modulex-h4 *::before,
  .modulex-h4 *::after { box-sizing: border-box; }

  .modulex-h4-wrap {
    max-width: --max--;
    margin-inline: auto;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: clamp(32px, 5vw, 72px);
    align-items: center;
  }

  /* --- metin sütunu --- */
  .modulex-h4-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 18px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: --accent--;
  }
  .modulex-h4-eyebrow::before {
    content: "";
    width: 28px;
    height: 2px;
    background: --accent--;
    border-radius: 2px;
  }
  .modulex-h4-baslik {
    margin: 0 0 20px;
    font-size: clamp(2rem, 1.3rem + 2.8vw, 3.6rem);
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: --text--;
    text-wrap: balance;
  }
  .modulex-h4-metin {
    margin: 0 0 30px;
    max-width: 56ch;
    font-size: clamp(1rem, 0.95rem + 0.3vw, 1.2rem);
    line-height: 1.7;
    color: --muted--;
  }
  .modulex-h4-ctalar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 34px;
  }
  .modulex-h4 a.modulex-h4-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 12px 26px;
    border-radius: calc(--radius-- / 1.6);
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 2px solid --accent--;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
  }
  /* css.css bağlantı rengi :where() ile sıfır özgüllük (31 Eki) → :link/:visited tekrarı gerekmez; varyant kuralları ezebilsin */
  .modulex-h4 a.modulex-h4-cta--dolgu {
    background: --accent--;
    color: --accentText--;
  }
  .modulex-h4 a.modulex-h4-cta--cerceve {
    background: transparent;
    color: --text--;
    border-color: --border--;
  }
  .modulex-h4 a.modulex-h4-cta:hover,
  .modulex-h4 a.modulex-h4-cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
  }
  .modulex-h4 a.modulex-h4-cta--cerceve:hover,
  .modulex-h4 a.modulex-h4-cta--cerceve:focus-visible {
    border-color: --accent--;
    color: --accent--;
  }
  .modulex-h4 a.modulex-h4-cta:focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-h4-cta .material-symbols-outlined { font-size: 20px; }
  [dir="rtl"] .modulex-h4-cta .material-symbols-outlined { transform: scaleX(-1); }

  .modulex-h4-guven {
    list-style: none;
    margin: 0;
    padding: 22px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 14px 28px;
    border-top: 1px solid --border--;
  }
  .modulex-h4-guven li {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: --muted--;
  }
  .modulex-h4-guven .material-symbols-outlined {
    font-size: 22px;
    color: --accent--;
    flex-shrink: 0;
  }

  /* --- görsel sütunu --- */
  .modulex-h4-gorsel {
    position: relative;
    min-width: 0;
    padding: 24px;
  }
  .modulex-h4-cerceve {
    position: relative;
    z-index: 2;
    overflow: hidden;
    aspect-ratio: 5 / 4;
    border-radius: --radius--;
    background: --surface--;
  }
  .modulex-h4-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* görsel yoksa: nötr yer tutucu (token'lı gradyan + ikon) */
  .modulex-h4-ph {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, color-mix(in srgb, --accent-- 24%, --surface--), --surface--);
    color: --muted--;
  }
  .modulex-h4-ph .material-symbols-outlined { font-size: 64px; opacity: 0.6; }

  .modulex-h4-sekil,
  .modulex-h4-sekil2 {
    position: absolute;
    z-index: 1;
    pointer-events: none;
  }
  .modulex-h4-rozet {
    position: absolute;
    z-index: 3;
    inset-inline-start: 0;
    bottom: 8%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px 12px 12px;
    border-radius: calc(--radius-- / 1.4);
    background: --surface--;
    color: --text--;
    border: 1px solid --border--;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
    animation: modulexH4Yuz 6s ease-in-out infinite;
  }
  .modulex-h4-rozet-ikon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: --accent--;
    color: --accentText--;
  }
  .modulex-h4-rozet-deger {
    display: block;
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.1;
    color: --text--;
  }
  .modulex-h4-rozet-etiket {
    display: block;
    font-size: 0.8rem;
    color: --muted--;
  }
  @keyframes modulexH4Yuz {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* === Varyant: blob — organik şekil, yuvarlak görsel === */
  .modulex-h4--blob .modulex-h4-sekil {
    inset: -6% -10% auto auto;
    width: 78%;
    aspect-ratio: 1;
    background: color-mix(in srgb, --accent-- 22%, transparent);
    border-radius: 58% 42% 55% 45% / 48% 60% 40% 52%;
  }
  .modulex-h4--blob .modulex-h4-sekil2 {
    inset: auto auto -8% -6%;
    width: 46%;
    aspect-ratio: 1;
    background: color-mix(in srgb, --accent-- 10%, transparent);
    border-radius: 45% 55% 50% 50% / 55% 45% 55% 45%;
  }
  .modulex-h4--blob .modulex-h4-cerceve { border-radius: calc(--radius-- * 1.6) --radius-- calc(--radius-- * 1.6) --radius--; }

  /* === Varyant: kare-kesit — keskin köşe, ofsetli dolu kare === */
  .modulex-h4--kare-kesit .modulex-h4-cerceve { border-radius: 0; aspect-ratio: 1 / 1; }
  .modulex-h4--kare-kesit .modulex-h4-sekil {
    inset: 0 0 auto auto;
    width: 60%;
    height: 60%;
    background: --accent--;
  }
  .modulex-h4--kare-kesit .modulex-h4-sekil2 {
    inset: auto auto 0 0;
    width: 40%;
    height: 40%;
    border: 2px solid --accent--;
  }
  .modulex-h4--kare-kesit .modulex-h4-rozet { border-radius: 0; inset-inline-start: auto; inset-inline-end: 0; bottom: -4px; }
  .modulex-h4--kare-kesit .modulex-h4-rozet-ikon { border-radius: 0; }
  .modulex-h4--kare-kesit a.modulex-h4-cta { border-radius: 0; }
  .modulex-h4--kare-kesit .modulex-h4-eyebrow::before { display: none; }
  .modulex-h4--kare-kesit .modulex-h4-eyebrow {
    padding: 6px 12px;
    /* %12 tonda vurgu yazısı 4,4:1'e düşüyordu (ölçüm) → %6 */
    background: color-mix(in srgb, --accent-- 6%, transparent);
    border-inline-start: 3px solid --accent--;
  }

  /* === Varyant: cerceveli — kalın çerçeve, yüzey paneli, çift çizgi === */
  .modulex-h4--cerceveli { background: --surface--; }
  .modulex-h4--cerceveli .modulex-h4-gorsel { padding: 32px; }
  .modulex-h4--cerceveli .modulex-h4-cerceve {
    border-radius: calc(--radius-- / 2);
    outline: 10px solid --bg--;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
  }
  .modulex-h4--cerceveli .modulex-h4-sekil {
    inset: 0;
    border: 2px solid --accent--;
    border-radius: calc(--radius-- / 2);
    transform: translate(14px, 14px);
  }
  .modulex-h4--cerceveli .modulex-h4-sekil2 { display: none; }
  .modulex-h4--cerceveli .modulex-h4-rozet { bottom: auto; top: 6%; inset-inline-start: auto; inset-inline-end: 4%; background: --bg--; }
  .modulex-h4--cerceveli .modulex-h4-guven li {
    padding: 8px 14px;
    border: 1px solid --border--;
    border-radius: 999px;
    background: --bg--;
  }
  .modulex-h4--cerceveli .modulex-h4-guven { border-top: 0; padding-top: 0; }
  [dir="rtl"] .modulex-h4--cerceveli .modulex-h4-sekil { transform: translate(-14px, 14px); }

  /* --- giriş animasyonu: yalnız JS varsa gizlenir (JS yoksa içerik görünür kalır) --- */
  .modulex-h4-js .modulex-h4-in {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .modulex-h4-js .modulex-h4-in:nth-child(2) { transition-delay: 0.06s; }
  .modulex-h4-js .modulex-h4-in:nth-child(3) { transition-delay: 0.12s; }
  .modulex-h4-js .modulex-h4-in:nth-child(4) { transition-delay: 0.18s; }
  .modulex-h4-js .modulex-h4-in:nth-child(5) { transition-delay: 0.24s; }
  .modulex-h4-js.modulex-h4-goster .modulex-h4-in { opacity: 1; transform: none; }

  @media (max-width: 1024px) {
    .modulex-h4-wrap { grid-template-columns: minmax(0, 1fr); gap: 36px; }
    .modulex-h4-gorsel { order: -1; max-width: 560px; margin-inline: auto; width: 100%; }
    .modulex-h4-icerik { text-align: start; }
  }
  @media (max-width: 768px) {
    .modulex-h4 { padding-block: 36px 44px; }
    .modulex-h4-gorsel { padding: 16px; }
    .modulex-h4--cerceveli .modulex-h4-gorsel { padding: 20px; }
    .modulex-h4-ctalar { flex-direction: column; }
    .modulex-h4 a.modulex-h4-cta { width: 100%; }
    .modulex-h4-rozet { padding: 10px 14px 10px 10px; }
    .modulex-h4-rozet-deger { font-size: 1.1rem; }
    .modulex-h4-guven { gap: 10px 18px; }
  }

  /* W2: mobil tasma kontrolu */
  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  /* W2: erisilebilirlik — animasyon kapatma */
  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
    .modulex-h4-js .modulex-h4-in { opacity: 1; transform: none; }
  }
</style>
<script>
  (function () {
    var kok = document.querySelector(".modulex-h4");
    if (!kok) { return; }
    var azalt = false;
    try { azalt = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { azalt = false; }
    if (azalt || !("IntersectionObserver" in window)) { return; }
    kok.classList.add("modulex-h4-js");
    var io = new IntersectionObserver(function (girdiler) {
      for (var i = 0; i < girdiler.length; i++) {
        if (girdiler[i].isIntersecting) {
          kok.classList.add("modulex-h4-goster");
          io.disconnect();
        }
      }
    }, { threshold: 0.15 });
    io.observe(kok);
    /* ilk ekranda zaten görünürse hemen göster */
    setTimeout(function () { kok.classList.add("modulex-h4-goster"); }, 600);
  })();
</script>
