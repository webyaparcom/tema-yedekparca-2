<header class="modulex-ust-yapiskan{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-yapiskan-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</header>

<style>
  /* ust-yapiskan — Kaydırmaya tepki veren tek menü: uzun sayfalarda her an erişilir, yer kaplamaz (incelir). */
  .modulex-ust-yapiskan { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-yapiskan *, .modulex-ust-yapiskan *::before, .modulex-ust-yapiskan *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-yapiskan :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-yapiskan :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-yapiskan :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-yapiskan :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-yapiskan img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-yapiskan) img { height: auto; }
  .modulex-ust-yapiskan [hidden] { display: none !important; }
  .modulex-ust-yapiskan :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-yapiskan :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-yapiskan-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-yapiskan-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-yapiskan--bassiz .modulex-ust-yapiskan-bas { display: none; }
  .modulex-ust-yapiskan-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-yapiskan-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-yapiskan-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-yapiskan-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-yapiskan-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-yapiskan-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-yapiskan-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-yapiskan-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-yapiskan-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-yapiskan { position: relative; z-index: 900; }
  .modulex-ust-yapiskan-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-yapiskan-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-yapiskan-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-yapiskan-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-yapiskan-oge:hover, .modulex-ust-yapiskan-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-yapiskan-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-yapiskan-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-yapiskan-cta .material-symbols-outlined, .modulex-ust-yapiskan-tel .material-symbols-outlined, .modulex-ust-yapiskan-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-yapiskan-tel, .modulex-ust-yapiskan-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-yapiskan-tel:hover, .modulex-ust-yapiskan-posta:hover { color: --accentInk--; }
  .modulex-ust-yapiskan-dil:empty { display: none; }
  .modulex-ust-yapiskan-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-yapiskan-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-yapiskan-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-yapiskan--acik .modulex-ust-yapiskan-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-yapiskan--acik .modulex-ust-yapiskan-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-yapiskan--acik .modulex-ust-yapiskan-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-yapiskan-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-yapiskan-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-yapiskan-sol 0.3s ease both; }
  @keyframes modulex-ust-yapiskan-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-yapiskan-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-yapiskan--js .modulex-ust-yapiskan-nav, .modulex-ust-yapiskan--js .modulex-ust-yapiskan-genis { display: none; }
    .modulex-ust-yapiskan--js .modulex-ust-yapiskan-ac { display: inline-flex; }
    .modulex-ust-yapiskan-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-yapiskan-in 0.3s ease both; }
    .modulex-ust-yapiskan-pliste { display: grid; }
    .modulex-ust-yapiskan-pliste .modulex-ust-yapiskan-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-yapiskan-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-yapiskan-panel { display: none !important; }
  }
  @keyframes modulex-ust-yapiskan-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-yapiskan.modulex-ust-yapiskan { position: sticky; inset-block-start: 0; z-index: 950; padding-inline: 0; background-color: --bg--; transition: box-shadow 0.3s ease, background-color 0.3s ease; }
  .modulex-ust-yapiskan--kucuk { background-color: color-mix(in srgb, --bg-- 90%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 10px 30px -22px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-ust-yapiskan-cubuk { display: flex; align-items: center; justify-content: space-between; gap: 16px 28px; max-width: 1240px; margin-inline: auto; padding: 22px 20px; transition: padding 0.3s ease; }
  .modulex-ust-yapiskan--kucuk .modulex-ust-yapiskan-cubuk { padding-block: 10px; }
  .modulex-ust-yapiskan-logo img { transition: max-height 0.3s ease; }
  .modulex-ust-yapiskan--kucuk .modulex-ust-yapiskan-logo img { max-height: calc(--logoH-- * 0.78); }
  .modulex-ust-yapiskan-liste { display: flex; flex-wrap: wrap; gap: 4px 30px; }
  .modulex-ust-yapiskan-liste .modulex-ust-yapiskan-oge::after { content: ""; position: absolute; inset-inline: 0; inset-block-end: 6px; height: 2px; border-radius: 2px; background: --accent--; transform: scaleX(0); transition: transform 0.3s ease; }
  .modulex-ust-yapiskan-liste .modulex-ust-yapiskan-oge:hover::after, .modulex-ust-yapiskan-liste .modulex-ust-yapiskan-oge[aria-current="page"]::after { transform: scaleX(1); }
  .modulex-ust-yapiskan-son, .modulex-ust-yapiskan-genis { display: flex; align-items: center; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-yapiskan-cubuk { padding-block: 12px; }
  }
  @media (max-width: 768px) {
    .modulex-ust-yapiskan-cubuk { padding-inline: 16px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-yapiskan :is(.modulex-ust-yapiskan-baslik, .modulex-ust-yapiskan-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-yapiskan-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-yapiskan { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-yapiskan *, .modulex-ust-yapiskan *::before, .modulex-ust-yapiskan *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-yapiskan";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const kucul = (s, P) => {
          let b = false;
          const u = () => { b = false; s.classList.toggle(P + "--kucuk", (window.scrollY || 0) > 24); };
          window.addEventListener("scroll", () => { if (!b) { b = true; requestAnimationFrame(u); } }, { passive: true });
          u();
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      kucul(s, P, az);
    });
  })();
</script>
