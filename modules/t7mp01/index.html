<style>
  .zoom-icon-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: --height--;
    width: 100%;
  }
  .zoom-icon {
    font-size: 250px !important;
    color: #333;
    animation: pulse 1s 3;
    opacity: 0.5;
  }
  @keyframes pulse {
    0% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
    }
  }
  .modulex-body {
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--max);
  }
  .modulex-body-chile {
    padding: 20px;
    display: flex;
    align-items: top;
    justify-content: left;
    flex-direction: column;
    position: absolute;
  }
  .modulex-body-chile > div {
    width: 100% !important;
  }
  .modulex2 {
    margin-top: 10px;
    margin-bottom: 10px;
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }
  .modulex {
    display: flex;
    flex-direction: column;
  }
  .modulex > svg {
    width: 100vw;
  }
  .modulexbotton {
    transform: scaleY(-1);
    margin-bottom: -1px;
  }
 
  .modulex-svg {
    fill: --backgroundcolor--;
  }
  .modulex-bg {
    background-image: url("{{img}}") !important;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    height: 100%;
    width: 100%;
    color: white;
    text-align: center;
    position: absolute;
    top: 0;
    left: 0;
    z-index: -1;
  }
  @media screen and (max-width: 1024px) {
  }

  /* W2: mobil tasma kontrolu */
  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  /* W2: erisilebilirlik — animasyon kapatma */
  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ---- G8-D varyantlar (31 Eki 2026): desing.stil → kök data-stil. "" = klasik (dalgalı kenar, tam genişlik).
     Rozet/bilgi kartı HTML'i back.js'ten yalnız ilgili stilde gelir; renkler yalnız var(--mx-site-*) token. ---- */

  [data-stil="cerceveli"],
  [data-stil="yan-bilgi"] {
    isolation: isolate;
    width: min(var(--max), calc(100% - 40px));
    margin: 24px auto;
    border-radius: var(--mx-radius-xl, 20px);
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
  }

  [data-stil="cerceveli"] .modulex > svg,
  [data-stil="yan-bilgi"] .modulex > svg {
    display: none;
  }

  [data-stil="cerceveli"] .zoom-icon-container,
  [data-stil="yan-bilgi"] .zoom-icon-container {
    height: 380px;
  }

  [data-stil="cerceveli"] .modulex-bg,
  [data-stil="yan-bilgi"] .modulex-bg {
    z-index: 0;
    transition: transform 0.3s ease;
  }

  [data-stil="cerceveli"] .modulex,
  [data-stil="yan-bilgi"] .modulex {
    position: relative;
    z-index: 1;
    width: 100%;
  }

  [data-stil="cerceveli"]:hover .modulex-bg,
  [data-stil="yan-bilgi"]:hover .modulex-bg {
    transform: scale(1.03);
  }

  /* büyüteç: klasikteki 250 px soluk #333 yerine yüzey zeminli küçük rozet (surface/text çifti → koyu modda da ölçülebilir ve okunur) */
  [data-stil="cerceveli"] .zoom-icon,
  [data-stil="yan-bilgi"] .zoom-icon {
    font-size: 40px !important;
    width: 72px;
    height: 72px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    opacity: 1;
    animation: none;
    background-color: var(--mx-site-surface, #fff);
    color: var(--mx-site-text, #1b1b1b);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
    transition: transform 0.25s ease;
  }

  [data-stil="cerceveli"]:hover .zoom-icon,
  [data-stil="yan-bilgi"]:hover .zoom-icon {
    transform: scale(1.08);
  }

  /* cerceveli — yuvarlak köşeli çerçeve, kalın yüzey kenarı, üstte adres rozeti */
  [data-stil="cerceveli"] {
    border: 6px solid var(--mx-site-surface, #fff);
  }

  [data-stil="cerceveli"] .modulex-badge {
    position: absolute;
    top: 18px;
    inset-inline-start: 18px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: calc(100% - 36px);
    min-height: 44px;
    padding: 10px 16px;
    border-radius: var(--mx-radius-full, 999px);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    background-color: var(--mx-site-surface, #fff);
    color: var(--mx-site-text, #1b1b1b);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }

  [data-stil="cerceveli"] .modulex-badge .material-symbols-outlined {
    color: var(--mx-site-primary, #2563eb);
    font-size: 22px;
  }

  /* yan-bilgi — harita 2/3, yanında bilgi kartı (adres/telefon/e-posta + yol tarifi) */
  [data-stil="yan-bilgi"] {
    display: grid;
    grid-template-columns: 2fr 1fr;
    align-items: stretch;
  }

  [data-stil="yan-bilgi"] .modulex-bg {
    left: auto;
    right: auto;
    width: auto;
    inset-inline-start: 0;
    inset-inline-end: 33.333%;
  }

  [data-stil="yan-bilgi"] .modulex-info {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 32px 28px;
    text-align: start;
    background-color: var(--mx-site-surface, #fff);
    color: var(--mx-site-text, #1b1b1b);
  }

  [data-stil="yan-bilgi"] .modulex-info-title {
    margin: 0 0 4px;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--mx-site-text, #1b1b1b);
  }

  [data-stil="yan-bilgi"] .modulex-info-row {
    margin: 0;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  [data-stil="yan-bilgi"] .modulex-info-row .material-symbols-outlined {
    flex: 0 0 auto;
    font-size: 22px;
    color: var(--mx-site-primary, #2563eb);
  }

  [data-stil="yan-bilgi"] .modulex-info-cta {
    margin-top: auto;
