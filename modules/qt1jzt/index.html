<section class="modulex-cta2">
  <div class="modulex-cta2-container">
    <span class="material-symbols-outlined modulex-cta2-icon" aria-hidden="true">{{icon}}</span>
    <h2 class="modulex-cta2-title">{{title}}</h2>
    <p class="modulex-cta2-desc">{{description}}</p>
    <a href="{{btnUrl}}" class="modulex-cta2-btn">
      <span>{{btnText}}</span>
      <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
    </a>
    <p class="modulex-cta2-note">{{note}}</p>
  </div>
</section>

<style>
  .modulex-cta2 {
    width: 100%;
    padding: 72px 20px;
    background: --bgcolor--;
    box-sizing: border-box;
  }

  .modulex-cta2-container {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    background: --cardbg--;
    border: 1px solid --bordercolor--;
    border-radius: 20px;
    padding: 48px 32px;
    box-sizing: border-box;
    animation: cta2In 0.6s ease both;
  }

  @keyframes cta2In {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modulex-cta2-icon {
    font-size: 46px;
    color: --accent--;
    margin-bottom: 12px;
    display: inline-block;
  }

  .modulex-cta2-title {
    font-size: 30px;
    font-weight: 800;
    color: --titlecolor--;
    margin: 0 0 10px;
  }

  .modulex-cta2-desc {
    font-size: 16px;
    line-height: 1.7;
    color: --textcolor--;
    margin: 0 auto 26px;
    max-width: 520px;
  }

  .modulex-cta2-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 50px;
    padding: 14px 34px;
    border-radius: 12px;
    background: --accent--;
    color: --accentText--; /* 31 Eki: sabit beyaz → token */
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  /* Global a:link/a:visited/a:hover {color:#000} (ham/css.css, özgüllük 0,1,1) düğme yazısını siyaha çeviriyordu →
     bileşik seçici (0,2,1) ve tüm bağlantı durumları beyaz kalır. */
  .modulex-cta2 a.modulex-cta2-btn,
  .modulex-cta2 a.modulex-cta2-btn:link,
  .modulex-cta2 a.modulex-cta2-btn:visited,
  .modulex-cta2 a.modulex-cta2-btn:hover,
  .modulex-cta2 a.modulex-cta2-btn:active {
    color: #fff;
  }

  .modulex-cta2-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
  }

  .modulex-cta2-note {
    font-size: 12px;
    color: --textcolor--;
    opacity: 0.75;
    margin: 14px 0 0;
  }

  @media (max-width: 768px) {
    .modulex-cta2 {
      padding: 44px 14px;
    }

    .modulex-cta2-container {
      padding: 34px 20px;
    }

    .modulex-cta2-title {
      font-size: 24px;
    }

    .modulex-cta2-btn {
      width: 100%;
      box-sizing: border-box;
    }

    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
