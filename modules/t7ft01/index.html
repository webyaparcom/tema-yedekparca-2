<footer class="footer" data-stil="--stil--">
    <div class="waves">
      <div class="wave" id="wave1"></div>
      <div class="wave" id="wave2"></div>
      <div class="wave" id="wave3"></div>
      <div class="wave" id="wave4"></div>
    </div>
    <div class="footer-marka">
      {{moduleimg}}
      {{socialbar}}
    </div>
    <ul class="menu">
      {{html}}
    </ul>
    {{langbar}}
    <p>&copy; 2026 {{web-name}}. @all-rights@.</p>
  </footer>
  <style>
    /* Logo + sosyal liste tek kolonda: sosyal liste yokken de cizgili stilin üç sütunu yerinde kalır, boş liste basılmaz */
    .footer-marka {
      position: relative;
      width: 100%;
    }
    .moduleimg {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }
    .moduleimg > img {
      width: 100%;
      max-width: --imgwidth--;
    }
  
    .footer {
      position: relative;
      background: --bgcolor--;
      padding: 20px 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin-top: 120px;
    }
  
    .social-icon,
    .menu {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
      flex-wrap: wrap;
    }
  
    .social-icon__item,
    .menu__item {
      list-style: none;
    }
  
    .social-icon__link {
      font-size: 2rem;
      color: --color--;
      margin: 0 10px;
      display: inline-block;
      transition: transform 0.5s;
    }
  
    .social-icon__link svg {
      display: block;
      font-size: inherit; /* css.css * { font-size } svg'nin kendisine de işler, 1em bağlantının boyutu olsun */
      width: 1em;
      height: 1em;
    }

    .social-icon__link:hover {
      transform: translateY(-10px);
    } 
  
    .menu__link {
      font-size: 1.2rem;
      color: --color-- !important;
      margin: 0 10px;
      display: inline-block;
      transition: opacity 0.5s;
      text-decoration: none;
      opacity: 0.75;
      font-weight: 300;
    }
  
    .menu__link:hover {
      opacity: 1;
    }
  
    .footer p { 
      color: --color--;
      margin: 15px 0 10px 0;
      font-size: 1rem;
      font-weight: 300;
    }
  
    .wave {
      position: absolute;
      top: -100px;
      left: 0;
      width: 100%;
      height: 100px;
      background-image: url("data:image/svg+xml,%3Csvg version='1.0' id='katman_1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' x='0px' y='0px' viewBox='0 0 640 65' style='enable-background:new 0 0 640 65;' xml:space='preserve'%3E%3Cstyle type='text/css'%3E .st0%7Bfill:%23#bgcolor#;%7D %3C/style%3E %3Cpath class='st0' d='M0,22.4C0,22.4,74.1,0,153,0c176.5,0,328.1,76.6,487,22.4V65H0V22.4z'/%3E%3C/svg%3E");
      background-size: 1000px 102px;
    }
  
    .wave#wave1 {
      z-index: 100;
      opacity: 1;
      bottom: 0;
      background-position-x: 0;
    }
  
    .wave#wave2 {
      z-index: 99;
      opacity: 0.5;
      bottom: 10px;
      background-position-x: 250px;
    }
  
    .wave#wave3 {
      z-index: 100;
      opacity: 0.2;
      bottom: 15px;
      background-position-x: 500px;
    }
  
    .wave#wave4 {
      z-index: 99;
      opacity: 0.7;
      bottom: 20px;
      background-position-x: 750px;
    }
  
  
  /* W2 — animasyon, mobil, erisilebilirlik */
  @keyframes modulexW2Enter {
    from { opacity: 0.98; }
    to { opacity: 1; }
  }

  [class*="modulex"] {
    box-sizing: border-box;
    animation: modulexW2Enter 0.3s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    .social-icon__link,
    .menu__link {
      animation: none !important;
      transition: none !important;
    }
  }

  /* ---- G8-D varyantlar (31 Eki 2026): desing.stil → kök data-stil. "" = klasik (dalgalı üst kenar, ortalı yığın).
     Zemin/yazı --bgcolor--/--color-- çifti aynen; ayraç/çerçeve renkleri --color-- türevi (color-mix), sabit renk yok. ---- */

  /* cizgili — üç sütun: sosyal | sayfalar | dil; sütunlar ince dikey ayraçla; telif alt şeritte */
  [data-stil="cizgili"] {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start;
    column-gap: 0;
    row-gap: 8px;
    padding: 48px 40px 20px;
    text-align: center;
  }

  [data-stil="cizgili"] .waves {
    grid-column: 1 / -1;
  }

  [data-stil="cizgili"] .social-icon,
  [data-stil="cizgili"] .menu,
  [data-stil="cizgili"] .wm-langbar {
    margin: 0;
    padding: 8px 24px;
    min-height: 100%;
    align-content: flex-start;
  }

  [data-stil="cizgili"] .menu {
    flex-direction: column;
    gap: 6px;
    border-inline: 1px solid color-mix(in srgb, --color-- 22%, transparent);
  }

  [data-stil="cizgili"] .menu__link {
    margin: 0;
    padding: 6px 12px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    opacity: 0.85;
  }

  [data-stil="cizgili"] .social-icon {
    flex-wrap: wrap;
    gap: 6px;
  }

  [data-stil="cizgili"] .social-icon__link {
    margin: 0 4px;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }

  [data-stil="cizgili"] .wm-langbar {
    display: flex;
    justify-content: center;
  }

  /* dil çubuğu: css.css'te renk kalıtımla gövdeden gelir (açık sitede koyu footer'da 1,2:1) → üç stilde de zemine bağlanır.
     --langcolor-- = desing.langcolor, yoksa --color--; o da bgcolor üstünde okunmuyorsa back.js siyah/beyazdan okunanı yazar */
  .footer .wm-langbar li a {
    color: --langcolor--;
    border-color: color-mix(in srgb, --langcolor-- 35%, transparent);
    background-color: color-mix(in srgb, --langcolor-- 10%, transparent);
  }

  .footer .wm-langbar li.wm-lang-active a,
  .footer .wm-langbar li a:hover {
    color: --bgcolor--;
    background-color: --langcolor--;
    border-color: --langcolor--;
  }

  [data-stil="cizgili"] p {
    grid-column: 1 / -1;
    width: 100%;
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px solid color-mix(in srgb, --color-- 18%, transparent);
    text-align: center;
  }

  /* ortali-sade — dalga yok, tek sütun ortalı; sosyal ikonlar büyük daire çerçeveli; menü nokta ayraçlı tek satır */
  [data-stil="ortali-sade"] {
    margin-top: 48px;
    padding: 56px 24px 28px;
    border-top: 4px solid color-mix(in srgb, --color-- 22%, transparent);
  }

  [data-stil="ortali-sade"] .waves {
    display: none;
  }

  [data-stil="ortali-sade"] .social-icon {
    gap: 10px;
    margin: 0 0 18px;
  }

  [data-stil="ortali-sade"] .social-icon__link {
    margin: 0;
    width: 60px;
    height: 60px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, --color-- 35%, transparent);
    transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
  }

  [data-stil="ortali-sade"] .social-icon__link:hover {
    transform: translateY(-4px);
    background-color: color-mix(in srgb, --color-- 12%, transparent);
    border-color: color-mix(in srgb, --color-- 60%, transparent);
  }

  [data-stil="ortali-sade"] .menu {
    gap: 4px 0;
  }

  [data-stil="ortali-sade"] .menu__item {
    display: inline-flex;
    align-items: center;
  }

  [data-stil="ortali-sade"] .menu__item + .menu__item::before {
    content: "\00B7";
    color: --color--;
    opacity: 0.45;
    font-size: 1.2rem;
  }

  [data-stil="ortali-sade"] .menu__link {
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
  }

  [data-stil="ortali-sade"] p {
    opacity: 0.7;
    font-size: 0.9rem;
    margin-top: 22px;
  }

  @media (max-width: 768px) {
    [data-stil="cizgili"] {
      grid-template-columns: 1fr;
      padding: 40px 20px 20px;
    }

    [data-stil="cizgili"] .menu {
      border-inline: 0;
      border-block: 1px solid color-mix(in srgb, --color-- 18%, transparent);
      padding: 16px 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-stil="ortali-sade"] .social-icon__link:hover {
      transform: none;
    }
  }

  /* Mobil uygulama kuralı (12 Kas 2026): dokunma hedefleri >= 48px (yalnız <=768px; masaüstü görünümü aynı) */
  @media (max-width: 768px) {
    .menu__link {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      margin: 0 4px;
    }

    .social-icon__link {
      min-width: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 4px;
    }

    .footer .wm-langbar li a {
      min-width: 48px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    [data-stil="cizgili"] .menu__link,
    [data-stil="ortali-sade"] .menu__link {
      min-height: 48px;
    }

    [data-stil="cizgili"] .social-icon__link {
      width: 48px;
      height: 48px;
    }
  }
</style>
