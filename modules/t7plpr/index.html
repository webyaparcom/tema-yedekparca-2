<div class="modulex">
  <div class="modulex-inner">
    {{headHtml}}
    <div class="modulex-body">{{html}}</div>
  </div>
</div>
<style>
  .modulex {
    width: 100%;
    margin: --margin--;
    box-sizing: border-box;
    background: --bgcolor--;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modulex * {
    box-sizing: border-box;
  }

  .modulex-inner {
    width: 100%;
    max-width: var(--max);
    display: flex;
    flex-direction: column;
    gap: 24px;
    animation: modulexPlIn 0.5s ease both;
  }

  .modulex-head {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 760px;
    padding-left: 16px;
    border-left: 4px solid --accent--;
  }

  .modulex-eyebrow {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: --accent--;
    line-height: 1.3;
  }

  .modulex-title {
    margin: 0;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: --titlecolor--;
    line-height: 1.2;
  }

  .modulex-subtitle {
    margin: 0;
    font-size: 0.98rem;
    line-height: 1.6;
    color: --textcolor--;
    opacity: 0.86;
    max-width: 640px;
  }

  .modulex-body {
    width: 100%;
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(--size--, 1fr);
  }

  .modulex-card {
    display: flex;
    flex-direction: column;
    background: --cardbg--;
    border: 1px solid --bordercolor--;
    border-radius: --radius--;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    animation: modulexPlCardIn 0.5s ease both;
  }

  .modulex-body .modulex-card:nth-child(1) { animation-delay: 0.03s; }
  .modulex-body .modulex-card:nth-child(2) { animation-delay: 0.06s; }
  .modulex-body .modulex-card:nth-child(3) { animation-delay: 0.09s; }
  .modulex-body .modulex-card:nth-child(4) { animation-delay: 0.12s; }
  .modulex-body .modulex-card:nth-child(5) { animation-delay: 0.15s; }
  .modulex-body .modulex-card:nth-child(6) { animation-delay: 0.18s; }
  .modulex-body .modulex-card:nth-child(7) { animation-delay: 0.21s; }
  .modulex-body .modulex-card:nth-child(8) { animation-delay: 0.24s; }
  .modulex-body .modulex-card:nth-child(n+9) { animation-delay: 0.27s; }

  .modulex-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 32px rgba(15, 23, 42, 0.14);
    border-color: --accent--;
  }

  .modulex-card-media {
    position: relative;
    aspect-ratio: --aspect-ratio--;
    overflow: hidden;
    background: --bordercolor--;
  }

  .modulex-card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .modulex-card:hover .modulex-card-media img {
    transform: scale(1.06);
  }

  .modulex-card-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: --textcolor--;
    opacity: 0.35;
  }

  .modulex-card-placeholder .material-symbols-outlined {
    font-size: 2.4rem;
  }

  .modulex-card-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 16px 16px;
    flex: 1;
  }

  .modulex-card-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.35;
    color: --titlecolor--;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .modulex-card-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: auto;
    padding-top: 4px;
    font-size: 0.82rem;
    font-weight: 700;
    color: --accent--;
    letter-spacing: 0.01em;
  }

  .modulex-card-cta-icon {
    font-size: 1.05rem;
    transition: transform 0.25s ease;
  }

  .modulex-card:hover .modulex-card-cta-icon {
    transform: translateX(3px);
  }

  @keyframes modulexPlIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes modulexPlCardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media screen and (max-width: 1024px) {
    .modulex-body {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
  }

  @media screen and (max-width: 768px) {
    .modulex-body {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .modulex-head {
      padding-left: 12px;
      gap: 6px;
    }

    .modulex-card-body {
      padding: 12px 12px 12px;
    }
  }

  a, button, [role="button"], input[type="submit"], input[type="button"] {
    cursor: pointer;
  }

  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      overflow-x: hidden;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .modulex-inner,
    .modulex-card,
    .modulex-card-media img,
    .modulex-card-cta-icon {
      animation: none !important;
      transition: none !important;
    }

    .modulex-card:hover {
      transform: none;
    }

    .modulex-card:hover .modulex-card-media img {
      transform: none;
    }
  }
</style>
