<div class="modulex-title f36">
  <h1>{{name}}</h1>
</div>
<div class="modulex">
  <div class="modulex-menu">{{pagelist}}</div>
  <div class="modulex-body">{{text}}</div>
</div>
<style>
  #content {
    justify-content: start;
  }
  .modulex {
    display: flex;
    width: var(--max);
    margin-top: 20px;
    gap: 20px;
  }
  .modulex-menu {
      width: 220px;
      background-color: var(--menubgcolor, transparent);
    border-radius: 5px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }
  .modulex-menu > a {
    background-color: #ffffff;
    padding: 10px 15px;
    border-radius: 5px;
    color: #333;
    text-decoration: none;
    transition: background-color 0.3s ease;
  }
  .modulex-menu > a:hover,
  .modulex-menu > .active {
    background-color: --menu-active--;
    color: --activetext--; /* 31 Eki: sabit beyaz → token */
  }
  .modulex-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .modulex-title {
    width: 100%;
    height: --height--px;
    background-color: --backgroundcolor--;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: --textcolor--; /* 31 Eki: sabit beyaz → token */
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }
  .modulex-title::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("/page/{{pageid}}/bg/{{bgimg}}");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: --opacity--;
    z-index: 1;
  }
  .modulex-title h1 {
    position: relative;
    z-index: 2;
    font-size: --font-size--px;
    margin: 0;
  }
  @media screen and (max-width: 1024px) {
    .modulex {
      flex-direction: column;
      width: calc(100% - 10px);
      padding: 5px;
    }
    .modulex-menu {
      display: none;
    }
    .modulex-body {
      width: 100%;
    }
  }

  /* W2: mobil tasma kontrolu */
  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  /* W2: erisilebilirlik — animasyon kapatma */
  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
